name: Fetch SteamSpy Data

on:
  schedule:
    - cron: '0 3 * * *'   # 毎日 日本時間 12:00
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch SteamSpy raw data
        run: |
          python3 << 'PYEOF'
          import urllib.request, urllib.parse, json, time, os, hashlib

          os.makedirs("raw", exist_ok=True)
          HEADERS = {"User-Agent": "Mozilla/5.0 (compatible; IndieScope/2.0)"}

          def fetch(tag):
              url = f"https://steamspy.com/api.php?request=tag&tag={urllib.parse.quote(tag)}"
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return resp.read()

          # フォールバック署名を取得（存在しないタグを叩く）
          fallback = fetch("ZZZ_INVALID_TAG_9999")
          fallback_hash = hashlib.md5(fallback).hexdigest()
          print(f"fallback hash: {fallback_hash}")
          time.sleep(2)

          # タグごとに候補名を順に試す（SteamSpyの正式タグ名の揺れに対応）
          genres = [
              ("Rogue-like",    ["Rogue-like", "Roguelike"]),
              ("Rogue-lite",    ["Rogue-lite", "Roguelite"]),
              ("Metroidvania",  ["Metroidvania"]),
              ("Platformer",    ["Platformer", "2D Platformer"]),
              ("Action_RPG",    ["Action RPG"]),
              ("Survival",      ["Survival"]),
              ("Tower_Defense", ["Tower Defense"]),
              ("Puzzle",        ["Puzzle"]),
              ("Visual_Novel",  ["Visual Novel"]),
              ("Horror",        ["Horror"]),
              ("Sandbox",       ["Sandbox"]),
              ("Strategy",      ["Strategy"]),
              ("Simulation",    ["Simulation"]),
              ("Fighting",      ["Fighting", "2D Fighter"]),
              ("Shoot_Em_Up",   ["Shoot 'Em Up", "Shoot 'em up", "Shmup"]),
          ]

          for file_name, candidates in genres:
              saved = False
              for tag in candidates:
                  try:
                      raw = fetch(tag)
                      h = hashlib.md5(raw).hexdigest()
                      if h == fallback_hash:
                          print(f"  {tag}: fallback -> next candidate")
                          time.sleep(2)
                          continue
                      data = json.loads(raw)
                      if len(data) < 10:
                          print(f"  {tag}: too few ({len(data)}) -> next")
                          time.sleep(2)
                          continue
                      with open(f"raw/{file_name}.json", "wb") as f:
                          f.write(raw)
                      print(f"OK {file_name} <- tag '{tag}' ({len(data)} games)")
                      saved = True
                      break
                  except Exception as e:
                      print(f"  {tag}: ERROR {e}")
                  finally:
                      time.sleep(2)
              if not saved:
                  print(f"NG {file_name}: all candidates failed")
          PYEOF

      - name: Aggregate to stats.json
        run: python3 scripts/aggregate.py raw data/stats.json

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stats.json
          git diff --staged --quiet && echo "No changes" || \
            (git commit -m "chore: update stats $(date -u +%Y-%m-%d)" && git push)
