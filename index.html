<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IndieScope — どの海で戦う？ Steamインディー市場の海図</title>
<meta name="description" content="Steamのインディーゲーム市場をジャンル別に分析。競合数・ヒット率・推定売上から、あなたが戦うべき「海」を見つける市場調査ツール。">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap');

:root {
  --paper:      #EBF0ED;
  --panel:      #FFFFFF;
  --ink:        #13323C;
  --muted:      #5E7A7E;
  --line:       #CFDCD7;
  --sea:        #12719A;
  --sea-soft:   #DDEBF1;
  --amber:      #B97F0A;
  --amber-soft: #F4E9CF;
  --coral:      #C7483B;
  --coral-soft: #F6DFDA;
  --deep:       #0D2830;
}

* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior:auto; } * { animation:none!important; transition:none!important; } }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Zen Kaku Gothic New', sans-serif;
  line-height: 1.7;
}

.mono { font-family:'IBM Plex Mono', monospace; }
.dot  { font-family:'DotGothic16', monospace; }

/* ───────── ヘッダー ───────── */
header {
  background: var(--deep);
  color: #E8F0EE;
  padding: 14px 28px;
  display: flex;
  align-items: baseline;
  gap: 14px;
  flex-wrap: wrap;
}
.logo { font-family:'DotGothic16',monospace; font-size:22px; letter-spacing:2px; color:#7FC4DE; }
.logo b { color:#E8F0EE; font-weight:400; }
.header-sub { font-size:12px; color:#8FA8AC; }
.header-update { margin-left:auto; font-size:11px; color:#6E8E93; font-family:'IBM Plex Mono',monospace; }

/* ───────── ヒーロー ───────── */
.hero {
  max-width: 1080px;
  margin: 0 auto;
  padding: 48px 24px 8px;
}
.hero h1 {
  font-family:'DotGothic16',monospace;
  font-weight: 400;
  font-size: clamp(26px, 4.5vw, 40px);
  letter-spacing: 1px;
  line-height: 1.4;
}
.hero h1 .sea-word   { color: var(--sea); }
.hero h1 .coral-word { color: var(--coral); }
.hero p {
  margin-top: 10px;
  font-size: 14px;
  color: var(--muted);
  max-width: 620px;
}

/* ───────── 海図（Ocean Map）───────── */
.ocean-wrap {
  max-width: 1080px;
  margin: 28px auto 0;
  padding: 0 24px;
}
.ocean-scroll { overflow-x: auto; }
.ocean {
  position: relative;
  min-width: 720px;
  height: 300px;
}
.ocean-water {
  position: absolute;
  left: 0; right: 0;
  top: 110px;
  height: 80px;
  border-radius: 6px;
  background: linear-gradient(90deg,
    #B7D9E6 0%, #C8DFE0 38%, #EBDDB9 62%, #E9C2B4 100%);
  border: 1px solid var(--line);
  overflow: hidden;
}
/* 等深線 */
.ocean-water::before {
  content: '';
  position: absolute; inset: 0;
  background:
    repeating-linear-gradient(0deg, transparent 0 14px, rgba(19,50,60,0.06) 14px 15px);
}
.ocean-axis {
  position: absolute;
  top: 196px;
  left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--muted);
  font-family:'IBM Plex Mono',monospace;
}
.ocean-axis-note {
  position: absolute;
  top: 216px; left: 0; right: 0;
  text-align: center;
  font-size: 11px;
  color: var(--muted);
}
.buoy {
  position: absolute;
  top: 138px;
  width: 16px; height: 16px;
  transform: translateX(-8px) rotate(45deg);
  background: var(--panel);
  border: 2.5px solid var(--ink);
  cursor: pointer;
  transition: transform 0.15s;
  z-index: 3;
}
.buoy:hover, .buoy:focus-visible { transform: translateX(-8px) rotate(45deg) scale(1.35); outline:none; }
.buoy.b-sea   { border-color: var(--sea); }
.buoy.b-amber { border-color: var(--amber); }
.buoy.b-coral { border-color: var(--coral); }
.buoy.active  { background: var(--ink); }
.buoy.active.b-sea   { background: var(--sea); }
.buoy.active.b-amber { background: var(--amber); }
.buoy.active.b-coral { background: var(--coral); }

.buoy-label {
  position: absolute;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--ink);
  white-space: nowrap;
  transform: translateX(-50%);
  cursor: pointer;
  z-index: 2;
  padding: 1px 4px;
}
.buoy-label::after {
  content:'';
  position: absolute;
  left: 50%;
  width: 1px;
  background: rgba(19,50,60,0.28);
}
.buoy-label.above::after { top: 100%; height: var(--lead, 18px); }
.buoy-label.below::after { bottom: 100%; height: var(--lead, 18px); }
.buoy-label:hover { color: var(--sea); }
.buoy-label.active { font-weight: 700; }

/* ───────── 比較表 ───────── */
.compare-wrap {
  max-width: 1080px;
  margin: 36px auto 0;
  padding: 0 24px;
}
.section-title {
  font-family:'DotGothic16',monospace;
  font-size: 17px;
  letter-spacing: 1px;
  margin-bottom: 4px;
}
.section-sub { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }
.compare-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow-x: auto;
}
table { width:100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
thead th {
  text-align: right;
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  padding: 12px 14px 9px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}
thead th:first-child { text-align: left; }
thead th:hover { color: var(--sea); }
thead th .arrow { font-size: 9px; }
tbody td {
  padding: 9px 14px;
  border-bottom: 1px solid #EDF2F0;
  text-align: right;
  font-family:'IBM Plex Mono',monospace;
  font-size: 12.5px;
  white-space: nowrap;
}
tbody td:first-child { text-align:left; font-family:'Zen Kaku Gothic New',sans-serif; font-weight:500; }
tbody tr:last-child td { border-bottom:none; }
tbody tr { cursor:pointer; }
tbody tr:hover td { background: var(--sea-soft); }
tbody tr.active td { background: var(--sea-soft); }
.pill {
  display:inline-block;
  font-size: 10.5px;
  font-family:'Zen Kaku Gothic New',sans-serif;
  padding: 1px 8px;
  border-radius: 99px;
  margin-left: 8px;
  vertical-align: 1px;
}
.pill.sea   { background:var(--sea-soft);   color:var(--sea); }
.pill.amber { background:var(--amber-soft); color:var(--amber); }
.pill.coral { background:var(--coral-soft); color:var(--coral); }

/* ───────── 詳細 ───────── */
.detail {
  max-width: 1080px;
  margin: 44px auto 0;
  padding: 0 24px 60px;
}
.verdict {
  border-radius: 10px;
  padding: 22px 26px;
  display: flex;
  gap: 18px;
  align-items: flex-start;
  border: 1px solid;
}
.verdict.sea   { background: var(--sea-soft);   border-color:#B5D3E0; }
.verdict.amber { background: var(--amber-soft); border-color:#E3CD9C; }
.verdict.coral { background: var(--coral-soft); border-color:#E8C0B8; }
.verdict-mark {
  width: 20px; height: 20px;
  transform: rotate(45deg);
  flex-shrink: 0;
  margin-top: 5px;
}
.verdict.sea   .verdict-mark { background: var(--sea); }
.verdict.amber .verdict-mark { background: var(--amber); }
.verdict.coral .verdict-mark { background: var(--coral); }
.verdict-title { font-family:'DotGothic16',monospace; font-size: 19px; letter-spacing:0.5px; }
.verdict.sea   .verdict-title { color: var(--sea); }
.verdict.amber .verdict-title { color: var(--amber); }
.verdict.coral .verdict-title { color: var(--coral); }
.verdict-text { font-size: 13.5px; margin-top: 4px; }

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin-top: 18px;
}
.kpi {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px 16px;
}
.kpi-label { font-size: 11px; color: var(--muted); }
.kpi-value { font-family:'IBM Plex Mono',monospace; font-size: 22px; font-weight: 600; margin-top: 2px; }
.kpi-sub   { font-size: 10.5px; color: var(--muted); margin-top: 1px; }

.chart-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 14px;
}
@media (max-width: 680px) { .chart-grid { grid-template-columns: 1fr; } }
.chart-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 16px;
}
.chart-title { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.chart-box { position: relative; height: 190px; }

.top-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  margin-top: 14px;
  overflow-x: auto;
}
.top-card table { min-width: 680px; }
.top-card thead th { cursor: default; }
.top-card thead th:hover { color: var(--muted); }
.game-name { font-weight: 500; }
.game-dev  { font-size: 11px; color: var(--muted); font-family:'Zen Kaku Gothic New',sans-serif; }
.scorebar { display:inline-flex; align-items:center; gap:6px; }
.scorebar .bar { width: 54px; height: 4px; background: #E4ECE9; border-radius: 2px; overflow:hidden; }
.scorebar .fill { height:100%; background: var(--sea); }

.method {
  margin-top: 26px;
  font-size: 11.5px;
  color: var(--muted);
  border-top: 1px solid var(--line);
  padding-top: 14px;
  line-height: 1.9;
}
.method b { color: var(--ink); font-weight: 500; }

.loading-view {
  max-width: 1080px;
  margin: 80px auto;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
}
.err-view {
  max-width: 680px;
  margin: 60px auto;
  padding: 20px 26px;
  background: var(--coral-soft);
  border: 1px solid #E8C0B8;
  border-radius: 8px;
  color: var(--coral);
  font-size: 13.5px;
}
footer {
  background: var(--deep);
  color: #6E8E93;
  font-size: 11.5px;
  text-align: center;
  padding: 18px;
  line-height: 1.9;
}
footer a { color:#7FC4DE; text-decoration:none; }
</style>
</head>
<body>

<header>
  <div class="logo">Indie<b>Scope</b></div>
  <div class="header-sub">Steam インディー市場の海図</div>
  <div class="header-update" id="updateTime"></div>
</header>

<div id="app">
  <div class="loading-view" id="loadingView">海図を読み込んでいます…</div>
</div>

<footer>
  IndieScope — インディーゲーム開発者のための市場調査ツール（非公式）<br>
  データ: <a href="https://steamspy.com" target="_blank" rel="noopener">SteamSpy API</a> ／ 毎日自動更新 ／ Valve Corporationとは関係ありません
</footer>

<script>
'use strict';

const state = { stats: null, selected: null, charts: {}, sortKey: 'count', sortAsc: true };

// ── フォーマッタ ──
const fmtNum = n => n.toLocaleString('ja-JP');
const fmtYen = n => '¥' + n.toLocaleString('ja-JP');
function fmtRevenue(yen) {
  if (yen >= 1e8) return (yen / 1e8).toFixed(1) + '億円';
  if (yen >= 1e4) return fmtNum(Math.round(yen / 1e4)) + '万円';
  return yen + '円';
}

// ── 海の判定 ──
// 競合数を基準に、1000レビュー超ヒット率で1段階補正
function verdictOf(g) {
  let level = g.count < 2000 ? 0 : g.count < 8000 ? 1 : 2;
  if (g.hit1000_rate >= 18) level = Math.max(0, level - 1);
  else if (g.hit1000_rate < 8) level = Math.min(2, level + 1);
  return ['sea', 'amber', 'coral'][level];
}
const VERDICT_META = {
  sea:   { name: 'ブルーオーシャン', advice: '競合とヒット率のバランスが良く、参入余地のある海です。差別化したコンセプトが発見されやすい環境です。' },
  amber: { name: 'イエローオーシャン', advice: '競合は一定数いますが、勝ち筋が残っている海です。ビジュアル・機構・ターゲットのどこかで明確な差別化が必要です。' },
  coral: { name: 'レッドオーシャン', advice: '競合数が非常に多く、ヒットの生まれにくい海です。よほど尖ったコンセプトと強いマーケティングがなければ埋もれます。' },
};

// ── 初期化 ──
init();
async function init() {
  try {
    const res = await fetch('./data/stats.json');
    if (!res.ok) throw new Error('stats.json の取得に失敗 (' + res.status + ')');
    state.stats = await res.json();

    const d = new Date(state.stats.updated_at);
    document.getElementById('updateTime').textContent =
      'DATA ' + d.toLocaleDateString('ja-JP', { month:'2-digit', day:'2-digit' }) + ' 更新';

    const valid = state.stats.genres.filter(g => g.valid);
    if (!valid.length) throw new Error('有効なジャンルデータがありません（次回の自動更新をお待ちください）');

    // 初期選択 = もっとも「良い海」（sea優先→ヒット率降順）
    const sorted = [...valid].sort((a, b) => {
      const va = verdictOf(a), vb = verdictOf(b);
      const rank = { sea: 0, amber: 1, coral: 2 };
      return rank[va] - rank[vb] || b.hit1000_rate - a.hit1000_rate;
    });
    state.selected = sorted[0].id;

    render();
  } catch (e) {
    document.getElementById('app').innerHTML =
      '<div class="err-view">読み込みに失敗しました。<br>' + e.message + '</div>';
  }
}

// ── 全体描画 ──
function render() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <section class="hero">
      <h1>どの<span class="sea-word">海</span>で戦うかを、<br>数字で決める。</h1>
      <p>Steamのインディーゲーム市場をジャンル別に分析。競合の数、ヒットの出やすさ、価格の相場から、あなたの企画が戦うべき「海」を見つけます。</p>
    </section>
    <section class="ocean-wrap">
      <div class="ocean-scroll"><div class="ocean" id="oceanMap">
        <div class="ocean-water"></div>
        <div class="ocean-axis"><span>← 競合が少ない</span><span>競合が多い →</span></div>
        <div class="ocean-axis-note">位置＝インディータイトル数（対数スケール）／ 色＝海の判定</div>
      </div></div>
    </section>
    <section class="compare-wrap">
      <div class="section-title">ジャンル比較表</div>
      <div class="section-sub">列見出しをクリックで並べ替え。行をクリックで詳細を表示。</div>
      <div class="compare-card"><table id="compareTable">
        <thead><tr>
          <th data-k="ja">ジャンル <span class="arrow"></span></th>
          <th data-k="count">競合数 <span class="arrow"></span></th>
          <th data-k="hit1000_rate">ヒット率 <span class="arrow"></span></th>
          <th data-k="median_reviews">中央値レビュー <span class="arrow"></span></th>
          <th data-k="median_price">中央値価格 <span class="arrow"></span></th>
          <th data-k="est_revenue_median">推定売上中央値 <span class="arrow"></span></th>
        </tr></thead>
        <tbody id="compareBody"></tbody>
      </table></div>
    </section>
    <section class="detail" id="detailSection"></section>
  `;
  renderOcean();
  renderCompare();
  renderDetail();
  document.querySelectorAll('#compareTable thead th').forEach(th => {
    th.addEventListener('click', () => {
      const k = th.dataset.k;
      if (state.sortKey === k) state.sortAsc = !state.sortAsc;
      else { state.sortKey = k; state.sortAsc = k === 'ja'; }
      renderCompare();
    });
  });
}

// ── 海図 ──
function renderOcean() {
  const map = document.getElementById('oceanMap');
  const valid = state.stats.genres.filter(g => g.valid);
  const logs = valid.map(g => Math.log10(g.count));
  const min = Math.min(...logs), max = Math.max(...logs);
  const posOf = g => {
    const t = (Math.log10(g.count) - min) / (max - min || 1);
    return 6 + t * 88; // 6%〜94%
  };

  // ラベル衝突回避: x位置順に上下3段へ交互配置
  const byX = [...valid].sort((a, b) => posOf(a) - posOf(b));
  const tiers = [
    { cls: 'above', top: 78,  lead: 46 },
    { cls: 'above', top: 44,  lead: 80 },
    { cls: 'above', top: 10,  lead: 114 },
    { cls: 'below', top: 200, lead: 48 },
    { cls: 'below', top: 232, lead: 80 },
  ];
  byX.forEach((g, i) => {
    const x = posOf(g);
    const v = verdictOf(g);
    const tier = tiers[i % tiers.length];

    const buoy = document.createElement('button');
    buoy.className = `buoy b-${v}` + (g.id === state.selected ? ' active' : '');
    buoy.style.left = x + '%';
    buoy.title = g.ja;
    buoy.setAttribute('aria-label', g.ja + 'の詳細を表示');
    buoy.addEventListener('click', () => select(g.id));
    map.appendChild(buoy);

    const label = document.createElement('div');
    label.className = `buoy-label ${tier.cls}` + (g.id === state.selected ? ' active' : '');
    label.style.left = x + '%';
    label.style.top = tier.top + 'px';
    label.style.setProperty('--lead', tier.lead + 'px');
    label.textContent = g.ja;
    label.addEventListener('click', () => select(g.id));
    map.appendChild(label);
  });
}

// ── 比較表 ──
function renderCompare() {
  const valid = state.stats.genres.filter(g => g.valid);
  const k = state.sortKey;
  const rows = [...valid].sort((a, b) => {
    const va = a[k], vb = b[k];
    const cmp = typeof va === 'string' ? String(va).localeCompare(vb, 'ja') : (va ?? 0) - (vb ?? 0);
    return state.sortAsc ? cmp : -cmp;
  });
  document.querySelectorAll('#compareTable thead th').forEach(th => {
    th.querySelector('.arrow').textContent =
      th.dataset.k === k ? (state.sortAsc ? '▲' : '▼') : '';
  });
  document.getElementById('compareBody').innerHTML = rows.map(g => {
    const v = verdictOf(g);
    return `<tr data-id="${g.id}" class="${g.id === state.selected ? 'active' : ''}">
      <td>${g.ja}<span class="pill ${v}">${VERDICT_META[v].name.replace('オーシャン','')}</span></td>
      <td>${fmtNum(g.count)}本</td>
      <td>${g.hit1000_rate}%</td>
      <td>${fmtNum(g.median_reviews)}件</td>
      <td>${g.median_price ? fmtYen(g.median_price) : '—'}</td>
      <td>${g.est_revenue_median ? fmtRevenue(g.est_revenue_median) : '—'}</td>
    </tr>`;
  }).join('');
  document.querySelectorAll('#compareBody tr').forEach(tr =>
    tr.addEventListener('click', () => select(tr.dataset.id)));
}

// ── 選択 ──
function select(id) {
  state.selected = id;
  document.querySelectorAll('.buoy, .buoy-label').forEach(el => el.classList.remove('active'));
  renderOceanActive(id);
  renderCompare();
  renderDetail();
  document.getElementById('detailSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function renderOceanActive(id) {
  const valid = state.stats.genres.filter(g => g.valid);
  const buoys = document.querySelectorAll('.buoy');
  const labels = document.querySelectorAll('.buoy-label');
  const byX = [...valid].sort((a, b) => a.count - b.count);
  byX.forEach((g, i) => {
    if (g.id === id) {
      buoys[i]?.classList.add('active');
      labels[i]?.classList.add('active');
    }
  });
}

// ── 詳細 ──
function renderDetail() {
  const g = state.stats.genres.find(x => x.id === state.selected);
  if (!g) return;
  const v = verdictOf(g);
  const meta = VERDICT_META[v];
  const el = document.getElementById('detailSection');

  el.innerHTML = `
    <div class="verdict ${v}">
      <div class="verdict-mark"></div>
      <div>
        <div class="verdict-title">${g.ja} — ${meta.name}</div>
        <div class="verdict-text">インディータイトル数 ${fmtNum(g.count)}本 ・ 1000レビュー超ヒット率 ${g.hit1000_rate}%。${meta.advice}</div>
      </div>
    </div>
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-label">競合タイトル数</div><div class="kpi-value">${fmtNum(g.count)}</div><div class="kpi-sub">AAA ${fmtNum(g.aaa_excluded)}本を除外済み</div></div>
      <div class="kpi"><div class="kpi-label">ヒット率</div><div class="kpi-value">${g.hit1000_rate}%</div><div class="kpi-sub">1000レビュー超の割合</div></div>
      <div class="kpi"><div class="kpi-label">中央値レビュー数</div><div class="kpi-value">${fmtNum(g.median_reviews)}</div><div class="kpi-sub">典型的なタイトルの実績</div></div>
      <div class="kpi"><div class="kpi-label">中央値価格</div><div class="kpi-value">${g.median_price ? fmtYen(g.median_price) : '—'}</div><div class="kpi-sub">有料タイトルのみ</div></div>
      <div class="kpi"><div class="kpi-label">平均スコア</div><div class="kpi-value">${g.avg_score ?? '—'}${g.avg_score ? '%' : ''}</div><div class="kpi-sub">好評率（レビュー10件以上）</div></div>
      <div class="kpi"><div class="kpi-label">推定売上 中央値</div><div class="kpi-value" style="font-size:18px">${g.est_revenue_median ? fmtRevenue(g.est_revenue_median) : '—'}</div><div class="kpi-sub">レビュー数×35×価格</div></div>
    </div>
    <div class="chart-grid">
      <div class="chart-card">
        <div class="chart-title">レビュー数の分布 — 「どのくらい売れるか」の現実</div>
        <div class="chart-box"><canvas id="chartReviews"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">価格帯の分布 — このジャンルの相場</div>
        <div class="chart-box"><canvas id="chartPrice"></canvas></div>
      </div>
    </div>
    <div class="top-card">
      <table>
        <thead><tr>
          <th style="text-align:left">売れ筋トップ12（レビュー数順）</th>
          <th>レビュー数</th><th>スコア</th><th>価格</th><th>推定累計売上</th>
        </tr></thead>
        <tbody>${g.top.map((t, i) => `
          <tr style="cursor:default">
            <td><span class="mono" style="color:var(--muted);font-size:11px;margin-right:8px">${String(i+1).padStart(2,'0')}</span><span class="game-name">${escHtml(t.name)}</span><div class="game-dev" style="margin-left:26px">${escHtml(t.dev)}</div></td>
            <td>${fmtNum(t.reviews)}</td>
            <td>${t.score !== null ? `<span class="scorebar"><span class="bar"><span class="fill" style="width:${t.score}%;display:block"></span></span>${t.score}%</span>` : '—'}</td>
            <td>${t.price === 0 ? '無料' : fmtYen(t.price)}</td>
            <td>${t.est_revenue ? fmtRevenue(t.est_revenue) : '—'}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div class="method">
      <b>データについて正直に：</b>
      データ源はSteamSpy API（毎日自動更新）。レビュー数と価格は実測値ですが、<b>推定売上はレビュー数×35（Boxleiter法）×価格による概算</b>で、実際とは大きく異なる場合があります。推定オーナー数500万以上のタイトルはAAAとして分析から除外しています。SteamSpyのタグ取得はレビューの少ない超小規模タイトルを網羅しない場合があり、実際の競合数はこの数字より多い可能性があります。海の判定（ブルー/イエロー/レッド）は競合数とヒット率による機械的な目安であり、個別の企画の成否を保証するものではありません。
    </div>
  `;

  drawCharts(g);
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function drawCharts(g) {
  Object.values(state.charts).forEach(c => c.destroy());
  state.charts = {};

  const gridColor = '#E4ECE9';
  const tickColor = '#5E7A7E';

  state.charts.reviews = new Chart(document.getElementById('chartReviews'), {
    type: 'bar',
    data: {
      labels: ['~50件', '50~200', '200~1K', '1K~5K', '5K件~'],
      datasets: [{
        data: g.review_dist,
        backgroundColor: ['#C8DCE5', '#A3C8D8', '#6FA9C2', '#3A88A8', '#12719A'],
        borderRadius: 3,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: tickColor, font: { size: 11 } }, grid: { display: false } },
        y: { ticks: { color: tickColor, font: { size: 11 } }, grid: { color: gridColor } }
      }
    }
  });

  state.charts.price = new Chart(document.getElementById('chartPrice'), {
    type: 'doughnut',
    data: {
      labels: ['無料', '~¥500', '¥500~1K', '¥1K~2K', '¥2K~4K', '¥4K~'],
      datasets: [{
        data: g.price_dist,
        backgroundColor: ['#C7483B', '#D98E6B', '#B97F0A', '#6FA9C2', '#3A88A8', '#12719A'],
        borderWidth: 2,
        borderColor: '#FFFFFF',
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '58%',
      plugins: { legend: { position: 'right', labels: { color: tickColor, font: { size: 11 }, boxWidth: 11, padding: 8 } } }
    }
  });
}
</script>
</body>
</html>
